<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050507" />
  <meta name="description" content="Fotos de la Back to the 80s · Sábado 5 de septiembre de 2026 · Teatro Vorterix" />
  <title>Fotos | Back to the 80s</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./vhs-fixes.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand brand-logo" href="#/" aria-label="Back to the 80s Photo Archive">
      <img id="galleryLogo" data-b64="./assets/back80s-logo-original.b64" alt="Back to the 80s" />
      <span class="brand-tag">PHOTO ARCHIVE</span>
    </a>
    <a class="ghost-button" href="#/">← Volver al VHS</a>
  </header>

  <main>
    <section id="homeView" class="vcr-home">
      <button id="insertTape" class="vcr-machine" type="button" aria-label="Insertar VHS y ver las fotos">
        <div class="machine-topline">
          <span>BACK TO THE 80s · VIDEO CASSETTE</span>
          <span id="machineStatus" class="rec-led">● STANDBY</span>
        </div>

        <div class="tape-bay">
          <div class="cover-display" aria-hidden="true">
            <img id="coverArt" data-b64="./assets/vhs-sep05-hq.b64" alt="Back to the 80s · VHS · Teatro Vorterix" />
          </div>

          <div class="slot-glow"></div>
          <div class="slot-mouth"><span>INSERT CASSETTE</span></div>

          <div id="vhsCassette" class="vhs-cassette" aria-hidden="true">
            <div class="cassette-top"><span>BACK TO THE 80s</span><span>VHS · HI-FI</span></div>
            <div class="cassette-window">
              <i class="reel reel-left"></i>
              <div class="cassette-label cassette-label-original">
                <img id="pirateLabel" data-b64="./assets/vhs-pirate-label.b64" alt="Etiqueta VHS original" />
              </div>
              <i class="reel reel-right"></i>
            </div>
            <div class="cassette-bottom"><span>PLAY IT LOUD</span><span>80s HOME VIDEO</span></div>
          </div>
        </div>

        <div class="machine-controls">
          <div class="archive-label"><b>05·09·2026</b><span>205 FOTOS · TEATRO VORTERIX</span></div>
          <div id="playControl" class="play-control">▶ TOCÁ EL VIDEOCASSETTE</div>
        </div>

        <div class="machine-footer">
          <span>PLAY IT LOUD</span>
          <span>STEREO · HI-FI · 1985 MODE</span>
        </div>
      </button>
    </section>

    <section id="galleryView" class="view hidden">
      <div class="gallery-header">
        <a href="#/" class="back-link">← Sacar VHS</a>
        <p class="eyebrow" id="galleryEyebrow"></p>
        <h1 id="galleryTitle" class="glitch-title" data-text="BACK TO THE 80S"></h1>
        <p class="gallery-subtitle" id="gallerySubtitle"></p>
        <div class="gallery-meta"><span id="photoCount"></span><span>·</span><span>Tocá una foto para verla grande</span></div>
      </div>
      <div id="galleryStatus" class="status-card"><strong>La cinta está lista.</strong><span>Cargando fotos…</span></div>
      <div id="photoGrid" class="photo-grid"></div>
      <aside class="next-party"><div><p class="eyebrow">NEXT EPISODE</p><h3>BACK TO THE 80s · HALLOWEEN</h3><p>3 de octubre · Teatro Vorterix</p></div><span class="next-badge">🎃</span></aside>
    </section>
  </main>

  <footer><span>BACK TO THE 80s</span><span>LA MEJOR FIESTA 80s DE LATINOAMÉRICA</span></footer>

  <dialog id="lightbox" class="lightbox">
    <button class="lightbox-close" id="closeLightbox" aria-label="Cerrar">×</button>
    <button class="lightbox-nav prev" id="prevPhoto" aria-label="Foto anterior">‹</button>
    <figure>
      <img id="lightboxImage" alt="Foto de Back to the 80s" />
      <figcaption><span id="lightboxNumber"></span><button id="downloadPhoto" class="download-button">↓ Descargar foto</button></figcaption>
    </figure>
    <button class="lightbox-nav next" id="nextPhoto" aria-label="Foto siguiente">›</button>
  </dialog>

  <script src="./assets-loader.js"></script>
  <script src="./app.js"></script>
</body>
</html>
